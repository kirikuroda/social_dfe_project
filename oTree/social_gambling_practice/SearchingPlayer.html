{{ block title }}
{{ endblock }}

{{ block styles }}
  {{ include C.MAIN_TEMPLATE }}
  <style>
    .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
    }
    .loader {
      width: 50vw;
      height: 40px;
      border-radius: 20px;
      color: #007bff;
      border: 2px solid;
      position: absolute;
      margin-top: 100px;
    }
    .loader::before {
      content: "";
      position: absolute;
      margin: 2px;
      inset: 0 100% 0 0;
      border-radius: inherit;
      background: currentColor;
      animation: l6 8s infinite;
    }
    @keyframes l6 {
        100% {inset:0}
    }
    .otree-timer {
      display: none;
    }
  </style>
{{ endblock }}

{{ block content }}
  <div class="container">
    <h2>Searching for other participants...</h2>
    <div class="loader"></div>
  </div>
  <button id="nextButton" class="otree-btn-next btn btn-primary btn-lg" style="display: none">Start practice</button>
  <script>
      setTimeout(function() {
          document.getElementById("nextButton").click();
      }, 8000);
  </script>
{{ endblock }}
